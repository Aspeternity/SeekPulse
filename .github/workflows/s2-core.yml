name: S2 Core Contracts

on:
  pull_request:
    paths:
      - 'app/domain.py'
      - 'app/delivery.py'
      - 'tests/test_s2_*.py'
      - '.github/workflows/s2-core.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: S2 core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
          cache: 'pip'
      - name: Install unchanged pinned upstream dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full offline S2 contracts with warnings visible
        run: python -m unittest discover -s tests -p 'test_s2_*.py' -v
      - name: Compile full source and regression suite
        run: python -m compileall -q app scripts tests
