name: S7 V1.1 Docker-06 Debian OS High Review (No Publish)

on:
  pull_request:
    paths:
      - 'scripts/v11_os_high_review.py'
      - 'tests/test_s7_os_high_review.py'
      - 'docs/decisions/ADR-0013-v11-os-high-review.md'
      - 'Dockerfile.v11'
      - 'compose.v11.yaml'
      - '.github/workflows/s7-v11-os-high-offline.yml'
      - '.github/workflows/s7-v11-security-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s7-docker06-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reviewer-regressions:
    name: Debian CVE evidence and full regression / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '${{ matrix.python-version }}'
          cache: pip
      - name: Install existing S5 test dependencies unchanged
        run: python -m pip install -r requirements-s5.txt
      - name: OS CVE reviewer rejects false remediation and release authorization
        run: python -m unittest discover -s tests -p 'test_s7_os_high_review.py' -v
      - name: Full offline S1-S7 Python regression
        run: python -m unittest discover -s tests -v
      - name: Static and distribution checks
        run: |
          python -m pip install ruff==0.13.3
          ruff check scripts/v11_os_high_review.py tests/test_s7_os_high_review.py
          python -m compileall -q app scripts tests
          python -m pip check

  compare-supported-base:
    name: Only compare OFFICIAL Bookworm base OS CVEs / linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: ['amd64', 'arm64']
    env:
      TRIVY_CACHE_DIR: /tmp/seekpulse-docker06-trivy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned public Trivy without GHCR credentials
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.75.0
          cache: false
      - name: Verify official Bookworm multi-platform index, pull only matching platform
        shell: bash
        run: |
          set -euo pipefail
          ref="docker.io/library/python:3.11-slim-bookworm"
          docker buildx imagetools inspect "$ref" > "${RUNNER_TEMP}/bookworm-index.txt"
          digest="$(awk '/^Digest:/ {print $2;exit}' "${RUNNER_TEMP}/bookworm-index.txt")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$ref@$digest" --raw > "${RUNNER_TEMP}/bookworm-manifest.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest=json.loads((Path(os.environ["RUNNER_TEMP"])/"bookworm-manifest.json").read_text())
          assert manifest["schemaVersion"] == 2
          architectures={
              f"{entry['platform']['os']}/{entry['platform']['architecture']}"
              for entry in manifest["manifests"] if "platform" in entry
          }
          assert {"linux/amd64","linux/arm64"}.issubset(architectures)
          print("BOOKWORM_OFFICIAL_TWO_ARCH_INDEX_VALID=PASS")
          PY
          docker pull --platform "linux/${{ matrix.arch }}" "$ref@$digest"
          docker tag "$ref@$digest" "seekpulse-bookworm-candidate:${{ matrix.arch }}"
          docker image inspect "seekpulse-bookworm-candidate:${{ matrix.arch }}" > "${RUNNER_TEMP}/bookworm-inspect.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          img=json.loads((Path(os.environ["RUNNER_TEMP"])/"bookworm-inspect.json").read_text())
          assert len(img) == 1
          assert img[0]["Architecture"] == os.environ["CANDIDATE_ARCH"]
          assert img[0]["Os"] == "linux"
          print("BOOKWORM_LOCAL_IMAGE_PLATFORM=PASS")
          PY
        env:
          CANDIDATE_ARCH: ${{ matrix.arch }}
      - name: Scan official base OS packages locally with fresh public CVE DB
        shell: bash
        run: |
          set -euo pipefail
          trivy --version
          trivy image --image-src docker --scanners vuln \
            --pkg-types os --timeout 20m --no-progress \
            --format json --output "${RUNNER_TEMP}/bookworm-os.json" \
            "seekpulse-bookworm-candidate:${{ matrix.arch }}"
          test -s "${RUNNER_TEMP}/bookworm-os.json"
          test -s "${TRIVY_CACHE_DIR}/db/metadata.json"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"bookworm-os.json").read_text())
          db=json.loads((Path(os.environ["TRIVY_CACHE_DIR"])/"db/metadata.json").read_text())
          updated=datetime.fromisoformat(db["UpdatedAt"].replace("Z","+00:00"))
          downloaded=datetime.fromisoformat(db["DownloadedAt"].replace("Z","+00:00"))
          now=datetime.now(timezone.utc)
          assert timedelta() <= now-updated <= timedelta(hours=48), "stale_public_vulnerability_db"
          assert timedelta() <= now-downloaded <= timedelta(hours=48), "stale_public_vulnerability_db_download"
          assert report["ArtifactType"] == "container_image"
          assert report["Metadata"]["OS"]["Family"] == "debian"
          results=report.get("Results", [])
          assert isinstance(results,list) and any(r.get("Class")=="os-pkgs" for r in results)
          all_cves={}
          for section in results:
              assert section.get("Class")=="os-pkgs", "only_os_scan_expected"
              for item in section.get("Vulnerabilities") or []:
                  if item.get("Severity") in ("HIGH","CRITICAL"):
                      vid=item.get("VulnerabilityID")
                      assert isinstance(vid,str) and vid
                      all_cves[vid]=all_cves.get(vid,0)+1
          historical=("CVE-2025-69720","CVE-2026-16742","CVE-2026-54369",
                      "CVE-2026-76642","CVE-2026-78408","CVE-2026-78409",
                      "CVE-2026-78410","CVE-2026-9538")
          print("OS_HIGH_CANDIDATE_NOT_RELEASED="+json.dumps({
              "candidate":"OFFICIAL_PYTHON_3_11_BOOKWORM_BASE_ONLY",
              "arch":os.environ["CANDIDATE_ARCH"],
              "cve_db_updated":db["UpdatedAt"],
              "high_critical_records":sum(all_cves.values()),
              "historical_cves":{
                  c:"REPORTED_HIGH" if c in all_cves else
                    "NOT_REPORTED_VERIFY_UPSTREAM" for c in historical},
              "other_high_critical_ids":sorted(set(all_cves)-set(historical)),
              "release_authorized":False,
              "runtime_switch_performed":False,
              "v11_compatibility_verified":False
          },sort_keys=True))
          PY
        env:
          CANDIDATE_ARCH: ${{ matrix.arch }}
