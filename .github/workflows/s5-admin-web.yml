name: S5 Admin Web

on:
  pull_request:
    paths:
      - 'app/web*.py'
      - 'app/web_ui/**'
      - 'tests/test_s5_*.py'
      - 'requirements-s5.txt'
      - '.github/workflows/s5-admin-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: S5 offline / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
          cache: pip
      - name: Install pinned S1-S5 dependencies
        run: python -m pip install -r requirements-s5.txt
      - name: Test S5 authentication, Web, shared SQLite, CSRF and XSS
        run: python -m unittest discover -s tests -p 'test_s5_*.py' -v
      - name: Full upstream and S1-S5 regressions
        run: python -m unittest discover -s tests -v
      - name: Ruff Web checks
        run: |
          python -m pip install ruff==0.13.3
          ruff check app/web_auth.py app/web_service.py app/web.py app/web_cli.py tests/test_s5_*.py
      - name: Compile application and regression suite
        run: python -m compileall -q app scripts tests
