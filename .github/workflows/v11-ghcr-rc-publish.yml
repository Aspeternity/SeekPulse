# release/v11-rc1-ghcr-publish — one-shot, separately user-approved RC only.
name: SeekPulse V1.1 RC1 GHCR Signed Release (One Shot)

on:
  pull_request:
    paths:
      - '.github/workflows/v11-ghcr-rc-publish.yml'
      - 'scripts/v11_rc_release_verify.py'
      - 'tests/test_s7_rc_release.py'
      - 'docs/deployment/V1.1-ghcr-rc-release.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v11-ghcr-rc-publish.yml'

permissions:
  contents: read

concurrency:
  group: seekpulse-ghcr-rc1-one-shot
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aspeternity/seekpulse
  RC_VERSION: v1.1.0-rc.1
  TRIVY_CACHE_DIR: /tmp/seekpulse-rc1-trivy

jobs:
  preflight:
    name: Exact source, complete offline regressions and RC security policy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Exact repository and main release source identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "Aspeternity/SeekPulse"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${GITHUB_REF}" = "refs/heads/main"
            test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          else
            test "${GITHUB_EVENT_NAME}" = "pull_request"
            test "${{ github.event.pull_request.base.ref }}" = "main"
          fi
          echo "RC1_MAIN_OR_PR_SOURCE_VERIFIED=PASS"
      - name: Release verification negative unit tests
        run: python -m unittest discover -s tests -p test_s7_rc_release.py -v
      - name: Existing full offline application regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-s5.txt
          python -m unittest discover -s tests -v
          python -m compileall -q app scripts tests
          python -m pip check

  platform:
    name: Scan real native RC then push that same image / linux/${{ matrix.arch }}
    needs: [preflight]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Aspeternity/SeekPulse'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert source identity, pinned official Alpine base and version
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${RC_VERSION}" = "v1.1.0-rc.1"
          grep -Fx 'FROM python:3.11-alpine3.24@sha256:d9368b3a5ac59afea7b5d4f2e2aea0941dbf9fdee9c369c5bec00b98244bc929' Dockerfile.v11
          echo "RC1_NATIVE_EXACT_SOURCE=PASS arch=${ARCH} revision=${GITHUB_SHA}"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.75.0
          cache: false
      - name: Build ONE tagged native RC image and run nonroot no-network import
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/rc1"
          mkdir -p "$root"
          local_image="seekpulse-prepublish-local:${ARCH}"
          docker buildx build --progress plain --file Dockerfile.v11 \
            --platform "linux/${ARCH}" --load \
            --provenance=false --sbom=false \
            --build-arg "SEEKPULSE_BUILD_VERSION=${RC_VERSION}" \
            --build-arg "SEEKPULSE_BUILD_REVISION=${GITHUB_SHA}" \
            --tag "$local_image" .
          docker image inspect "$local_image" > "$root/inspect-array.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"rc1"
          rows=json.loads((root/"inspect-array.json").read_text())
          assert len(rows)==1
          (root/"inspect.json").write_text(json.dumps(rows[0]))
          PY
          docker run --rm --platform "linux/${ARCH}" --network none \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --entrypoint python "$local_image" \
            -c 'from importlib.util import find_spec; assert find_spec("pip") is None; import app.v11_main; print("RC1_NATIVE_NO_NETWORK_RUNTIME=PASS")'
      - name: Unsuppressed full local OS+PyPI Trivy and CycloneDX on SAME image ID
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/rc1"
          image="seekpulse-prepublish-local:${ARCH}"
          trivy image --image-src docker --scanners vuln --pkg-types os,library \
            --timeout 20m --no-progress --format json --output "$root/scan.json" "$image"
          trivy image --image-src docker --timeout 20m --no-progress \
            --format cyclonedx --output "$root/sbom.json" "$image"
          test -s "${TRIVY_CACHE_DIR}/db/metadata.json"
          python -m scripts.v11_rc_release_verify local \
            --scan "$root/scan.json" --sbom "$root/sbom.json" \
            --db "${TRIVY_CACHE_DIR}/db/metadata.json" --inspect "$root/inspect.json" \
            --arch "${ARCH}" --revision "${GITHUB_SHA}" --version "${RC_VERSION}"
          echo "RC1_NATIVE_FIVE_SEVERITIES_ZERO=PASS arch=${ARCH}"
      - name: Login to GHCR only after image security passed
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: Push the SAME scanned image (NO new build)
        shell: bash
        run: |
          set -euo pipefail
          tag="${IMAGE}:${RC_VERSION}-${ARCH}-${GITHUB_SHA:0:12}"
          docker tag "seekpulse-prepublish-local:${ARCH}" "$tag"
          docker push "$tag"
          docker buildx imagetools inspect "$tag"
          echo "RC1_NATIVE_SCANNED_BYTES_PUSHED=PASS arch=${ARCH}"

  publish:
    name: Re-pull GHCR digests, zero-CVE rescan, sign+SBOM+provenance, release
    needs: [preflight, platform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Aspeternity/SeekPulse'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fail closed on existing RC release or tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${RC_VERSION}" = "v1.1.0-rc.1"
          if gh release view "${RC_VERSION}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "EXISTING_RC_RELEASE_BLOCKED"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/${RC_VERSION}" | grep -q .; then
            echo "EXISTING_RC_TAG_BLOCKED"
            exit 1
          fi
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.75.0
          cache: false
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          cosign-release: v2.6.0
      - name: Authenticated GHCR read and write
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: Compose remote staging index from EXACT pushed manifest digests
        id: index
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/rc1"
          mkdir -p "$root"
          amd="${IMAGE}:${RC_VERSION}-amd64-${GITHUB_SHA:0:12}"
          arm="${IMAGE}:${RC_VERSION}-arm64-${GITHUB_SHA:0:12}"
          remote_digest() {
            docker buildx imagetools inspect "$1" | awk '$1=="Digest:" {print $2; exit}'
          }
          amd_digest="$(remote_digest "$amd")"
          arm_digest="$(remote_digest "$arm")"
          [[ "$amd_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$amd_digest" != "$arm_digest"
          stage="${IMAGE}:stage-${RC_VERSION}-${GITHUB_SHA:0:12}"
          docker buildx imagetools create --tag "$stage" "$amd" "$arm"
          digest="$(remote_digest "$stage")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect --raw "${IMAGE}@${digest}" > "$root/index.json"
          python -m scripts.v11_rc_release_verify index --index "$root/index.json" \
            --amd64-digest "$amd_digest" --arm64-digest "$arm_digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "INDEX_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "AMD_DIGEST=$amd_digest" >> "$GITHUB_ENV"
          echo "ARM_DIGEST=$arm_digest" >> "$GITHUB_ENV"
          echo "RC1_REAL_REGISTRY_INDEX_CONTENT_VERIFIED=PASS"
      - name: Re-pull actual GHCR bytes for BOTH platforms, fresh remote Trivy/SBOM
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/rc1"
          for arch in amd64 arm64; do
            if [ "$arch" = amd64 ]; then platform_digest="${AMD_DIGEST}";
            else platform_digest="${ARM_DIGEST}"; fi
            # Staging index->platform digest mapping was verified above.
            # Classic Docker cannot load both platforms using the same index
            # digest in one image store. Re-pull the verified child manifests.
            ref="${IMAGE}@${platform_digest}"
            image="seekpulse-remote-verified:${arch}"
            docker pull --platform "linux/${arch}" "$ref"
            docker tag "$ref" "$image"
            docker image inspect "$image" > "$root/inspect-${arch}-array.json"
            python - "$arch" <<'PY'
          import json, os, sys
          from pathlib import Path
          arch=sys.argv[1]
          root=Path(os.environ["RUNNER_TEMP"])/"rc1"
          rows=json.loads((root/f"inspect-{arch}-array.json").read_text())
          assert len(rows)==1
          (root/f"inspect-{arch}.json").write_text(json.dumps(rows[0]))
          PY
            trivy image --image-src docker --scanners vuln --pkg-types os,library \
              --timeout 20m --no-progress --format json \
              --output "$root/scan-${arch}.json" "$image"
            trivy image --image-src docker --timeout 20m --no-progress \
              --format cyclonedx --output "$root/sbom-${arch}.json" "$image"
            python -m scripts.v11_rc_release_verify remote \
              --scan "$root/scan-${arch}.json" --sbom "$root/sbom-${arch}.json" \
              --db "${TRIVY_CACHE_DIR}/db/metadata.json" \
              --inspect "$root/inspect-${arch}.json" \
              --arch "$arch" --revision "${GITHUB_SHA}" --version "${RC_VERSION}" \
              --index-digest "${INDEX_DIGEST}" --platform-digest "$platform_digest"
            docker run --rm --platform "linux/${arch}" --network none \
              --read-only --cap-drop ALL --security-opt no-new-privileges \
              --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
              --entrypoint python "$image" \
              -c 'import app.v11_main; print("RC1_REAL_REMOTE_NETWORK_OFF=PASS")'
          done
          echo "RC1_BOTH_REAL_GHCR_PLATFORM_BYTES_TRIVY_ZERO=PASS"
      - name: Ensure truly anonymous registry pull (NAS/PVE can fetch image)
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          DOCKER_CONFIG="$tmp" docker buildx imagetools inspect \
            "${IMAGE}@${INDEX_DIGEST}" > "${RUNNER_TEMP}/rc1/anonymous.txt"
          grep -F "${INDEX_DIGEST}" "${RUNNER_TEMP}/rc1/anonymous.txt"
          echo "RC1_ANONYMOUS_GHCR_READ=PASS"
      - name: Keyless OIDC Cosign sign actual remote index, independently verify
        shell: bash
        run: |
          set -euo pipefail
          ref="${IMAGE}@${INDEX_DIGEST}"
          cosign sign --yes "$ref"
          cosign verify \
            --certificate-identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/v11-ghcr-rc-publish.yml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-sha="${GITHUB_SHA}" "$ref" \
            > "${RUNNER_TEMP}/rc1/cosign-check.json"
          test -s "${RUNNER_TEMP}/rc1/cosign-check.json"
          echo "RC1_REMOTE_COSIGN_CERT_AND_DIGEST_PASS"
      - name: Sign GitHub OIDC release provenance for real index digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/aspeternity/seekpulse
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest remote AMD64 CycloneDX SBOM to same index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/aspeternity/seekpulse
          subject-digest: ${{ steps.index.outputs.digest }}
          sbom-path: ${{ runner.temp }}/rc1/sbom-amd64.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest remote ARM64 CycloneDX SBOM to same index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/aspeternity/seekpulse
          subject-digest: ${{ steps.index.outputs.digest }}
          sbom-path: ${{ runner.temp }}/rc1/sbom-arm64.json
          push-to-registry: true
          create-storage-record: false
      - name: Cryptographically verify issuer, source SHA, provenance and two SBOMs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="oci://${IMAGE}@${INDEX_DIGEST}"
          root="${RUNNER_TEMP}/rc1"
          gh attestation verify "$ref" --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/v11-ghcr-rc-publish.yml" \
            --source-digest "${GITHUB_SHA}" \
            --predicate-type "https://slsa.dev/provenance/v1" \
            --format json > "$root/provenance-verified.json"
          gh attestation verify "$ref" --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/v11-ghcr-rc-publish.yml" \
            --source-digest "${GITHUB_SHA}" \
            --predicate-type "https://cyclonedx.org/bom" \
            --format json > "$root/sboms-verified.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"rc1"
          provenance=json.loads((root/"provenance-verified.json").read_text())
          sboms=json.loads((root/"sboms-verified.json").read_text())
          assert isinstance(provenance,list) and len(provenance)>=1
          assert isinstance(sboms,list) and len(sboms)>=2
          print("RC1_OIDC_PROVENANCE_AND_BOTH_SBOMS_VERIFIED=PASS")
          PY
      - name: Set official RC tag and GitHub prerelease only AFTER all preceding checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="${IMAGE}@${INDEX_DIGEST}"
          final="${IMAGE}:${RC_VERSION}"
          docker buildx imagetools create --tag "$final" "$ref"
          published="$(docker buildx imagetools inspect "$final" | awk '$1=="Digest:" {print $2; exit}')"
          test "$published" = "${INDEX_DIGEST}"
          echo "RC1_FINAL_IMAGE_TAG_EQUALS_SIGNED_INDEX=PASS"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RC_VERSION}" -f sha="${GITHUB_SHA}" >/dev/null
          remote_tag="$(git ls-remote origin "refs/tags/${RC_VERSION}" | awk '{print $1}')"
          test "$remote_tag" = "${GITHUB_SHA}"
          {
            echo "SeekPulse V1.1 Docker Compose Release Candidate 1"
            echo
            echo "Immutable, verified GHCR image: ${IMAGE}@${INDEX_DIGEST}"
            echo "Git source revision: ${GITHUB_SHA}"
            echo
            echo "Native AMD64 and ARM64 image bytes, real remote registry manifests,"
            echo "fresh Trivy OS/PyPI zero findings, both CycloneDX SBOMs, GitHub OIDC"
            echo "provenance and Cosign digest signature were verified by this workflow."
            echo "No NAS, PVE, Synology or Portainer user deployment was performed."
          } > "${RUNNER_TEMP}/rc1/release-notes.md"
          gh release create "${RC_VERSION}" -R "${GITHUB_REPOSITORY}" \
            --verify-tag --prerelease --title "SeekPulse v1.1.0 RC1" \
            --notes-file "${RUNNER_TEMP}/rc1/release-notes.md"
          gh release view "${RC_VERSION}" -R "${GITHUB_REPOSITORY}" \
            --json tagName,isPrerelease,url
          echo "RC1_SIGNED_GHCR_AND_GITHUB_RELEASE_SUCCESS=PASS digest=${INDEX_DIGEST}"
