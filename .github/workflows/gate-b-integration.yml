name: Gate B V1.1 Offline Integration

on:
  pull_request:
    paths:
      - 'app/gate_b_*.py'
      - 'app/instance_lock.py'
      - 'app/v11_main.py'
      - 'app/main.py'
      - 'app/db.py'
      - 'app/route_store.py'
      - 'app/rss.py'
      - 'app/source_adapters.py'
      - 'app/web.py'
      - 'app/web_service.py'
      - 'app/web_ui/templates/channels.html'
      - 'tests/test_gate_b_*.py'
      - 'docs/decisions/ADR-0007-gate-b-runtime-cutover.md'
      - '.github/workflows/gate-b-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-b-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Gate B offline / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
          cache: pip
      - name: Install pinned S1-S5 dependencies (never real credentials)
        run: python -m pip install -r requirements-s5.txt
      - name: Gate B migration, dispatch, runtime, security and cutover tests
        run: python -m unittest discover -s tests -p 'test_gate_b_*.py' -v
      - name: Entire S1-S6 + Gate B regression suite
        run: python -m unittest discover -s tests -v
      - name: Ruff and syntax checks
        run: |
          python -m pip install ruff==0.13.3
          ruff check app/gate_b_targets.py app/gate_b_dispatch.py app/instance_lock.py app/v11_main.py app/main.py app/db.py app/route_store.py app/rss.py app/source_adapters.py app/web.py app/web_service.py tests/test_gate_b_*.py
          python -m compileall -q app scripts tests
