name: S0 Public Source One-Shot (Diagnostic)

on:
  pull_request:
    paths:
      - "scripts/s0_public_probe.py"
      - "scripts/s0_mtproto_probe.py"
      - "scripts/s0_dual_source_probe.py"
      - "tests/test_s0_dual_source_probe.py"
      - "tests/test_s0_mtproto_probe.py"
      - "tests/test_s0_public_probe.py"
      - "docs/research/**"
      - ".github/workflows/s0-public-probe.yml"

permissions:
  contents: read

jobs:
  public-source-diagnostic:
    name: S0 diagnostic (not MTProto latency)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline parser safety tests
        run: python -m unittest discover -s tests -p 'test_s0_public_probe.py' -v
      - name: One read-only public sample per source
        continue-on-error: true
        run: python scripts/s0_public_probe.py --timeout 12 --output s0-public-snapshot.json
      - name: Report actual outcome; never claim TG MTProto speed
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("s0-public-snapshot.json")
          lines = ["### S0 Public Source (read-only diagnostic)", ""]
          if path.is_file():
              payload = json.loads(path.read_text(encoding="utf-8"))
              for src in payload["sources"]:
                  lines.append(f"- {src['source']}: {src['status']}; IDs={len(src['unique_post_ids'])}; HTTP={src.get('http_status', 'N/A')}")
          else:
              lines.append("- No result file: probe script could not complete.")
          lines.extend(["", "**This is not an MTProto benchmark.** Latency/coverage: UNMEASURED."])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s0-public-source-one-shot
          path: s0-public-snapshot.json
          if-no-files-found: warn
          retention-days: 7

  telethon-offline-contract:
    name: S0 Telethon library contract (no login)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install S0 research dependency only
        run: python -m pip install -r docs/research/S0-01-telethon-requirement.txt
      - name: Verify Telethon interfaces without any network login
        run: |
          python - <<'PY'
          from telethon import TelegramClient, events
          assert hasattr(TelegramClient, "catch_up")
          assert hasattr(TelegramClient, "iter_messages")
          assert hasattr(TelegramClient, "get_input_entity")
          assert hasattr(events, "NewMessage")
          print("S0_ONLY_TELETHON_IMPORT_AND_CONTRACT=PASS")
          PY
      - name: Read-only probe offline simulations
        run: python -m unittest discover -s tests -p 'test_s0_mtproto_probe.py' -v
      - name: S0-02 dual-source offline timing and recovery tests
        run: python -m unittest discover -s tests -p 'test_s0_dual_source_probe.py' -v
