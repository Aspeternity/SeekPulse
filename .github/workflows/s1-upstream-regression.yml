name: S1 Upstream Regression

on:
  pull_request:
    paths:
      - 'app/**'
      - 'tests/test_s1_*.py'
      - 'requirements.txt'
      - '.github/workflows/s1-upstream-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    name: S1 offline contracts / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install unchanged pinned upstream dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source and S1 test suite
        run: python -m compileall -q app tests
      - name: Run isolated upstream behavior and dependency contracts
        run: python -m unittest discover -s tests -p 'test_s1_*.py' -v
