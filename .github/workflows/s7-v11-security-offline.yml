name: S7 V1.1 Docker-04+08 CVE, SBOM and Pinned Alpine Base (No Publish)

on:
  pull_request:
    paths:
      - 'Dockerfile.v11'
      - 'scripts/v11_security_evidence.py'
      - 'tests/test_s7_security_evidence.py'
      - 'docs/decisions/ADR-0011-v11-release-security.md'
      - 'docs/decisions/ADR-0015-v11-alpine-runtime-migration.md'
      - 'docs/deployment/V1.1-docker-offline.md'
      - '.github/workflows/s7-v11-security-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s7-docker04-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-contract:
    name: Security gate and full regression / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '${{ matrix.python-version }}'
          cache: pip
      - name: Install unchanged S1-S5 dependencies
        run: python -m pip install -r requirements-s5.txt
      - name: Reject stale, incomplete or forged security evidence
        run: python -m unittest discover -s tests -p 'test_s7_security_evidence.py' -v
      - name: Entire existing S1-S7 + Docker-04 offline regression
        run: python -m unittest discover -s tests -v
      - name: Ruff, compile and pip compatibility
        run: |
          python -m pip install ruff==0.13.3
          ruff check scripts/v11_security_evidence.py tests/test_s7_security_evidence.py
          python -m compileall -q app scripts tests
          python -m pip check

  verify-pinned-base:
    name: Read-only official Python base digest and platform contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify pinned Dockerfile base resolves to official multiarch index
        shell: bash
        run: |
          set -euo pipefail
          base="$(awk '$1 == "FROM" {print $2}' Dockerfile.v11)"
          [[ "$base" =~ ^python:3[.]11-alpine3[.]24@sha256:d9368b3a5ac59afea7b5d4f2e2aea0941dbf9fdee9c369c5bec00b98244bc929$ ]]
          docker buildx imagetools inspect "$base" --raw > "${RUNNER_TEMP}/pinned-official-index.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          index = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "pinned-official-index.json").read_text()
          )
          assert index["schemaVersion"] == 2
          platforms = {
              f"{d['platform']['os']}/{d['platform']['architecture']}"
              for d in index["manifests"] if "platform" in d
          }
          assert {"linux/amd64", "linux/arm64"}.issubset(platforms), platforms
          print("PINNED_OFFICIAL_BASE_AMD64_ARM64_VERIFIED=PASS")
          PY

  scan-local-platform:
    name: Trivy OS+PyPI and CycloneDX / linux/${{ matrix.arch }} (local only)
    # Native runners avoid emulated native-wheel and SQLite behavior in QEMU.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      # Job-level env cannot access runner.temp; hosted Linux runner is ephemeral.
      TRIVY_CACHE_DIR: /tmp/seekpulse-docker04-trivy-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure Buildx for local builds only
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Install a fixed Trivy scanner version from pinned action
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.75.0
          cache: false
      - name: Build strictly local image, never login/push
        shell: bash
        run: |
          set -euo pipefail
          image="seekpulse-security-local:${{ matrix.arch }}"
          docker buildx build --file Dockerfile.v11 \
            --platform "linux/${{ matrix.arch }}" \
            --provenance=false --sbom=false --load \
            --build-arg SEEKPULSE_BUILD_VERSION=0.0.0-ci \
            --build-arg "SEEKPULSE_BUILD_REVISION=${GITHUB_SHA}" \
            --tag "$image" .
          mkdir -p "${RUNNER_TEMP}/security"
          docker image inspect "$image" > "${RUNNER_TEMP}/security/inspect-array.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "security"
          images = json.loads((p / "inspect-array.json").read_text())
          assert len(images) == 1
          (p / "inspect.json").write_text(json.dumps(images[0]))
          PY
          docker run --rm --platform "linux/${{ matrix.arch }}" \
            --network none --entrypoint python "$image" -m pip check
          # Check the final installed versions inside the actual local image.
          docker run --rm --platform "linux/${{ matrix.arch }}" \
            --network none --entrypoint python "$image" -c '
          from importlib.metadata import version
          approved = {
              "aiohttp": "3.14.3",
              "jaraco.context": "6.1.0",
              "wheel": "0.46.2",
              "setuptools": "84.0.0",
          }
          for name, patched in approved.items():
              actual = version(name)
              assert actual == patched, (name, actual, patched)
          from importlib.resources import files
          vendor = files("setuptools").joinpath("_vendor")
          entries = {item.name for item in vendor.iterdir()}
          assert "jaraco_context-6.1.0.dist-info" in entries
          assert "wheel-0.46.3.dist-info" in entries
          assert "jaraco.context-5.3.0.dist-info" not in entries
          assert "wheel-0.45.1.dist-info" not in entries
          print("SETUPTOOLS_VENDOR_FIXED=PASS")
          import aiohttp, app.v11_main
          print("V11_PATCHED_IMAGE_RUNTIME=PASS")
          '
      - name: Scan local OS+Python packages with current public vulnerability DB
        shell: bash
        run: |
          set -euo pipefail
          trivy --version
          image="seekpulse-security-local:${{ matrix.arch }}"
          root="${RUNNER_TEMP}/security"
          trivy image --image-src docker --scanners vuln \
            --pkg-types os,library \
            --timeout 20m --no-progress \
            --format json --output "$root/vulnerabilities.json" "$image"
          test -s "$root/vulnerabilities.json"
          test -s "${TRIVY_CACHE_DIR}/db/metadata.json"
      - name: Create CycloneDX SBOM from same local image (no upload)
        shell: bash
        run: |
          set -euo pipefail
          image="seekpulse-security-local:${{ matrix.arch }}"
          trivy image --image-src docker \
            --timeout 20m --no-progress \
            --format cyclonedx \
            --output "${RUNNER_TEMP}/security/sbom.cdx.json" "$image"
          test -s "${RUNNER_TEMP}/security/sbom.cdx.json"
      - name: Require fresh DB, complete OS+PyPI inventory and independent CVE verdict
        shell: bash
        run: |
          set -euo pipefail
          image="seekpulse-security-local:${{ matrix.arch }}"
          root="${RUNNER_TEMP}/security"
          python scripts/v11_security_evidence.py \
            --scan "$root/vulnerabilities.json" \
            --sbom "$root/sbom.cdx.json" \
            --db-metadata "${TRIVY_CACHE_DIR}/db/metadata.json" \
            --inspect "$root/inspect.json" \
            --platform "linux/${{ matrix.arch }}" \
            --image "$image" \
            --os-family alpine \
            --output "$root/report.json"
          # Report is local-only and deliberately release_authorized=false.
          # A real High/Critical CVE is reported as BLOCKED; do not wash CI green.
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"security"/"report.json"
          report=json.loads(path.read_text())
          assert report["release_authorized"] is False
          assert report["release_ready"] is False
          assert report["remote_index_digest"] is None
          # Keep public package/CVE evidence visible BEFORE asserting.
          # Runner's private raw scan and SBOM never leave the runner.
          print("LOCAL_SECURITY_REPORT="+json.dumps(report,sort_keys=True))
          # Only real Trivy scan results can prove the PyPI High fixes.
          language = report["findings"]["by_package_class"]["lang-pkgs"]
          if language["HIGH"] or language["CRITICAL"]:
              matching = [
                  item for item in report["findings"]["high_critical_package_sample"]
                  if item["source"] == "lang-pkgs"
              ]
              print("PYPI_HIGH_REMAINS="+json.dumps(matching,sort_keys=True))
          assert language["HIGH"] == 0, "real_trivy_pypi_high_not_cleared"
          assert language["CRITICAL"] == 0, "real_trivy_pypi_critical_not_cleared"
          os_findings = report["findings"]["by_package_class"]["os-pkgs"]
          if os_findings["HIGH"] or os_findings["CRITICAL"]:
              assert report["vulnerability_gate"] == "BLOCKED_HIGH_OR_CRITICAL"
          assert report["release_ready"] is False
          print("PYPI_HIGH_AFTER_PATCH=0 OS_HIGH_REMAINS="+str(os_findings["HIGH"]))

          PY
      - name: Review Alpine OS findings and retain historical Debian CVE evidence
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/security"
          image="seekpulse-security-local:${{ matrix.arch }}"
          python scripts/v11_os_high_review.py \
            --scan "$root/vulnerabilities.json" \
            --validated-report "$root/report.json" \
            --platform "linux/${{ matrix.arch }}" \
            --image "$image" \
            --os-family alpine \
            --output "$root/os-high-review.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"security"/"os-high-review.json"
          evidence=json.loads(p.read_text())
          assert evidence["release_ready"] is False
          assert evidence["release_authorized"] is False
          assert evidence["ghcr_image_status"] == "NOT_PUBLISHED"
          os_high=evidence["os_high_records"]
          os_critical=evidence["os_critical_records"]
          if os_high or os_critical:
              assert evidence["risk_gate"] == "BLOCKED_HIGH_OR_CRITICAL"
          cves={k:v["scan_state"] for k,v in evidence["historical_high_cves"].items()}
          assert evidence["os_family"] == "alpine"
          print("ALPINE_OS_HIGH_AND_HISTORICAL_DEBIAN_EVIDENCE="+json.dumps({
              "platform":evidence["platform"],
              "os_high_records":os_high,
              "os_critical_records":os_critical,
              "historical":cves,
              "new_high_ids":evidence["other_high_critical_cve_ids"],
              "risk_gate":evidence["risk_gate"],
              "release_authorized":False,
          },sort_keys=True))
          # Fail CI *after* emitting the precise unsuppressed affected-CVE
          # evidence. Changing distro must never make High/Critical ignorable.
          assert os_high == 0 and os_critical == 0, "runtime_alpine_os_high_or_critical"
          PY
