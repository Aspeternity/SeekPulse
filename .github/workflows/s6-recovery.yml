name: S6 Recovery and Backup

on:
  pull_request:
    paths:
      - 'app/maintenance.py'
      - 'tests/test_s6_*.py'
      - 'docs/decisions/ADR-0006-s6-consistent-backup.md'
      - 'docs/research/S6-01-recovery-acceptance.md'
      - '.github/workflows/s6-recovery.yml'
      - 'requirements-s5.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: S6 offline / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
          cache: pip
      - name: Install existing S1-S5 pinned dependencies
        run: python -m pip install -r requirements-s5.txt
      - name: S6 offline WAL backup, restore and injected failure contracts
        run: python -m unittest discover -s tests -p 'test_s6_*.py' -v
      - name: Existing S1-S5 full offline regressions (real optional deps)
        run: python -m unittest discover -s tests -v
      - name: Check S6 strict Ruff and compile all
        run: |
          python -m pip install ruff==0.13.3
          ruff check app/maintenance.py tests/test_s6_*.py
          python -m compileall -q app scripts tests
