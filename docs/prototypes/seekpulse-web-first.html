<script>
'use strict';
const PAGE_LABELS={overview:'运行概览',sources:'监控来源',rules:'关键词规则',notifications:'通知管理',history:'推送历史',settings:'系统设置'};
const safe = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>({page:'overview',signedIn:false,theme:'light',adminName:'admin',source:{rss:true,tg:false,interval:'10'},botConfigured:false,botEnabled:false,tgAuthorized:false,notificationsTab:'targets',ruleFilter:'all',historyFilter:'all',adminCreated:false,defaultTargets:[],blocked:['广告'],rules:[{id:1,text:'DMIT',enabled:true,priority:'normal',targets:[]},{id:2,text:'香港 + 优惠',enabled:true,priority:'urgent',targets:[]},{id:3,text:'二手',enabled:false,priority:'normal',targets:[]}],targets:[],nextRule:4,nextTarget:1,events:[]});
let S=initial();
const qs=(s,root=document)=>root.querySelector(s);
const qsa=(s,root=document)=>Array.from(root.querySelectorAll(s));
function toast(msg,detail='本地原型操作；未调用任何接口。'){const el=document.createElement('div');el.className='toast';el.innerHTML=`${safe(msg)}<small>${safe(detail)}</small>`;qs('#toastHost').append(el);while(qs('#toastHost').children.length>3)qs('#toastHost').firstElementChild.remove();setTimeout(()=>el.remove(),4200)}
function pill(txt,kind=''){return `<span class="pill ${kind}">${safe(txt)}</span>`}
function head(title,desc,right=''){return `<div class="pageHead"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${right}</div></div>`}
function cardTitle(t,d='',right=''){return `<div class="cardHead"><div><h2>${t}</h2>${d?`<p>${d}</p>`:''}</div>${right}</div>`}
function switcher(id,on,disabled=false){return `<button type="button" data-switch="${id}" role="switch" aria-checked="${!!on}" aria-label="${id} 开关" class="switch ${on?'on':''}" ${disabled?'disabled':''}></button>`}
function markTitle(name,icon,detail){return `<div class="rowLeft"><span class="square">${icon}</span><div><strong>${name}</strong><small>${detail}</small></div></div>`}
function modeInfo(){const r=S.source.rss,t=S.source.tg;return r&&t?['双来源协同模式','RSS 与 Telegram 独立获取新帖，使用同一 NodeSeek 帖子 ID 进行规范化、字段补全和持久化去重；同一目标避免重复投递。']:r?['RSS 独立模式','只使用 RSS 获取新帖，不依赖 Telegram 采集账号、Bot Token 或其他通知渠道。']:t?['TG 独立模式','只从 @nodeseekc 识别 NodeSeek 新帖；仅使用可信字段匹配规则，不假定 TG 消息具有 RSS 版块或摘要。']:['采集已全部暂停','RSS 和 TG 均不再采集新帖；管理中心、配置、历史和已存在数据仍可访问。']}
function modeCard(){const [title,desc]=modeInfo();return `<div class="sourceMode"><h2>◈ 当前模式：${title}（演示）</h2><p>${desc}</p></div>`}

<div class="notice" style="margin-bottom:20px">下列为界面排版用的**虚构示例**，与实际 NodeSeek 帖子、推送或网络状态无关。正式版将展示真实任务日志。</div><div class="card">${cardTitle('消息投递记录','平台 API 接受不代表设备已接收到通知。')}<div class="tabs"><button class="${S.historyFilter==='all'?'active':''}" data-history-filter="all">全部</button><button class="${S.historyFilter==='sent'?'active':''}" data-history-filter="sent">已接受</button><button class="${S.historyFilter==='retry'?'active':''}" data-history-filter="retry">待重试</button><button class="${S.historyFilter==='blocked'?'active':''}" data-history-filter="blocked">已抑制</button></div><div class="tableWrap"><table class="table"><thead><tr><th>帖子</th><th>命中规则</th><th>目标渠道</th><th>状态</th><th>时间</th><th></th></tr></thead><tbody>${shown.map((x,i)=>`<tr><td><strong>${safe(x.name)}</strong><small>演示数据 · 非真实链接</small></td><td>${safe(x.rule)}</td><td>${safe(x.provider)}</td><td>${pill(x.state==='sent'?'API 已接受':x.state==='retry'?'待重试':'已抑制',x.state==='sent'?'good':x.state==='retry'?'warn':'')}</td><td>${safe(x.time)}</td><td><button class="btn sm" data-history-detail="${fixtures.indexOf(x)}">查看详情</button></td></tr>`).join('')}</tbody></table></div>${shown.length?'':'<div class="empty">没有符合筛选的模拟记录。</div>'}</div>`}
function settings(){return `${head('系统设置','管理员、安全、数据备份、诊断和版本信息在这里集中管理。')}
<div class="grid two"><section class="card">${cardTitle('管理员与访问','Web 独立于 Telegram Bot 创建管理员账号。')}<div class="statusPanel"><span class="emoji">⌑</span><div><strong>${S.adminCreated?'演示管理员已创建':'尚未完成首次管理员设置'}</strong><p>正式版应提供管理员密码修改、登录会话及账号关联管理。</p></div></div><div class="formActions"><button class="btn" data-action="password-demo">模拟修改管理员密码</button><button class="btn" data-action="wizard">首次设置向导</button></div></section>
<section class="card">${cardTitle('运行参数','日常配置应由 Web 保存并应用，无需重启 Stack。')}<div class="formGrid"><div class="field"><span>日志级别</span><select id="logLevel"><option>INFO</option><option>WARNING</option><option>DEBUG（故障排查）</option></select></div><div class="field"><span>系统语言</span><select><option>简体中文</option><option disabled>English（后续）</option></select></div></div><div class="formActions"><button class="btn primary" data-action="save-settings">保存设置（模拟）</button></div></section>
<section class="card">${cardTitle('数据备份与恢复','备份和恢复需要可验证的流程，而不是直接复制运行中的 SQLite 文件。')}<div class="healthRows"><div class="healthRow"><span>数据库状态</span>${pill('未连接后端')}</div><div class="healthRow"><span>最近一次备份</span><span class="sm muted">—</span></div></div><div class="formActions"><button class="btn" data-action="backup-demo">模拟创建备份</button><button class="btn" data-action="restore-demo">恢复流程说明</button></div></section>
<section class="card">${cardTitle('诊断与版本','来源、通知、运行实例问题统一在 Web 中显示。')}<div class="healthRows"><div class="healthRow"><span>产品版本</span>${pill('Web-first A 原型')}</div><div class="healthRow"><span>后端服务</span>${pill('未连接（演示）','warn')}</div><div class="healthRow"><span>旧 RC1</span><span class="sm muted">v1.1.0-rc.1 · 未修改</span></div></div><div class="formActions"><button class="btn" data-action="diagnostics-demo">模拟诊断</button><button class="btn" data-action="theme">切换明暗模式</button></div></section></div>`}
function modal(title,summary,body,onSaveLabel='保存（模拟）'){qs('#modalRoot').innerHTML=`<div class="modalShade"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalHead"><div><h2 id="modalTitle">${title}</h2><p>${summary}</p></div><button class="btn sm circle" data-close-modal aria-label="关闭">✕</button></div><form id="dialogForm" autocomplete="off"><div class="modalBody">${body}<div class="notice" style="margin-top:16px"><strong>重要：</strong>本地原型不发送网络请求，不保存密钥；演示字段仅在页面内存临时使用。不要填写真实密钥。</div></div><div class="modalFoot"><button class="btn" type="button" data-close-modal>取消</button><button class="btn primary" type="submit">${onSaveLabel}</button></div></form></div></div>`;qs('#dialogForm').addEventListener('submit',saveModal);}
let modalKind=null,editId=null;
function openRule(id=null){let r=id?S.rules.find(x=>x.id===id):null;modalKind='rule';editId=id;let body=`<div class="formGrid"><div class="field wide"><span>关键词或 AND 组合</span><input name="ruleText" maxlength="100" required placeholder="例如 DMIT 或 香港 + 优惠" value="${safe(r?.text||'')}"><span class="hint">使用 + 连接多个词表示 AND；普通单词独立匹配。</span></div><div class="field"><span>优先级</span><select name="priority"><option value="normal" ${r?.priority==='urgent'?'':'selected'}>普通</option><option value="urgent" ${r?.priority==='urgent'?'selected':''}>紧急</option></select></div><div class="field"><span>状态</span><select name="state"><option value="true" ${r?.enabled===false?'':'selected'}>启用</option><option value="false" ${r?.enabled===false?'selected':''}>暂停</option></select></div><div class="field wide"><span>指定通知目标（不选即继承默认）</span><div class="choiceList">${S.targets.length?S.targets.map(t=>`<label class="choice"><input type="checkbox" name="ruleTarget" value="${t.id}" ${r?.targets?.includes(t.id)?'checked':''}>${safe(t.name)}</label>`).join(''):'<div class="hint">尚未添加通知目标，保存后可再修改。</div>'}</div></div></div>`;modal(r?'编辑关键词规则':'新增关键词规则','规则的配置和编辑都应在 Web 完成。',body,'保存规则（模拟）')}
function openBot(){modalKind='bot';editId=null;modal('配置 Telegram Bot','Bot 负责向用户、群组、频道发送通知，与 Telegram 来源登录相互独立。',`<div class="formGrid"><div class="field wide"><span>Bot Token</span><input name="botToken" type="password" placeholder="输入 fake-demo 即可体验；不要用真实 Token" autocomplete="off"><div class="hint">正式版会在后端验证并安全保存，不在界面回显。</div></div><div class="field"><span>管理员绑定</span><select name="adminBind"><option value="later">由 Web 发起一次性授权绑定</option></select></div><div class="field"><span>默认通知</span><select><option>不自动发送测试消息</option></select></div></div>`,S.botConfigured?'更新 Bot（模拟）':'保存 Bot（模拟）')}
function openTarget(kind='bark',id=null){let t=id?S.targets.find(x=>x.id===id):null;kind=t?.kind||kind;modalKind=kind;editId=id;let core=`<div class="formGrid"><div class="field wide"><span>目标名称</span><input name="targetName" required maxlength="64" value="${safe(t?.name||'')}" placeholder="例如 我的 iPhone"></div>`;let fields=kind==='bark'?`<div class="field"><span>Bark 服务器地址</span><input name="targetServer" placeholder="https://api.day.app" value="${safe(t?.server||'https://api.day.app')}"></div><div class="field"><span>设备 Key</span><input name="targetKey" type="password" placeholder="填 fake-demo 进行模拟，不要填真实 Key"></div>`:kind==='ntfy'?`<div class="field"><span>ntfy 服务器地址</span><input name="targetServer" value="${safe(t?.server||'https://ntfy.sh')}" placeholder="https://ntfy.sh"></div><div class="field"><span>Topic</span><input name="targetTopic" required value="${safe(t?.topic||'')}" placeholder="演示主题 example-topic"></div><div class="field wide"><span>访问 Token（可选）</span><input name="targetKey" type="password" placeholder="不要输入真实 Token"></div>`:`<div class="field wide"><span>聊天目标 ID</span><input name="targetChat" inputmode="numeric" placeholder="例如 123456（演示）" required value="${safe(t?.chat||'')}"></div><div class="field wide"><div class="statusPanel"><span class="emoji">➤</span><div><strong>与 Bot 绑定</strong><p>正式版应通过 Bot 对话/验证码确认目标归属，不接受任意陌生群组 ID。</p></div></div></div>`;modal(`${t?'编辑':'添加'}${kind==='telegram'?' Telegram':kind==='bark'?' Bark':' ntfy'} 通知目标`,'所有日常通知配置都在 Web 操作，保存后可单独测试。',core+fields+'</div>','保存目标（模拟）')}
function saveModal(e){e.preventDefault();let f=new FormData(e.currentTarget);if(modalKind==='rule'){let text=String(f.get('ruleText')||'').trim();if(!text){toast('关键词不能为空');return;}let values=f.getAll('ruleTarget').map(Number);let rule={id:editId||S.nextRule++,text,priority:String(f.get('priority')),enabled:String(f.get('state'))==='true',targets:values};if(editId)S.rules=S.rules.map(x=>x.id===editId?rule:x);else S.rules.unshift(rule);S.events.unshift(`已${editId?'编辑':'新增'}模拟规则「${text}」`);toast('关键词规则已在本地模拟保存');}
else if(modalKind==='bot'){S.botConfigured=true;S.events.unshift('已模拟配置 Telegram Bot');toast('Telegram Bot 已标记为模拟配置','未连接 Telegram API，未保存 Token 内容。');}
else {const name=String(f.get('targetName')||'').trim();if(!name){toast('请填写目标名称');return;}let meta=modalKind==='ntfy'?String(f.get('targetTopic')||''):modalKind==='bark'?'设备 Key 已模拟配置':`Chat ID ${String(f.get('targetChat')||'')}`;let item={id:editId||S.nextTarget++,name,kind:modalKind,meta,server:String(f.get('targetServer')||''),topic:String(f.get('targetTopic')||''),chat:String(f.get('targetChat')||''),enabled:editId?S.targets.find(x=>x.id===editId).enabled:false};if(editId)S.targets=S.targets.map(x=>x.id===editId?item:x);else S.targets.push(item);S.events.unshift(`已${editId?'编辑':'添加'}模拟 ${modalKind} 目标：${name}`);toast('通知目标已在本地模拟保存','未发送通知，也未保存 Key 或 Token。');}
qs('#modalRoot').innerHTML='';render()}
function eventAction(a){switch(a){case 'source-help':toast('四种模式：仅 RSS / 仅 TG / 双来源协同 / 全部暂停','双来源时统一帖子 ID、字段补全、持久去重；TG 来源不是发送通知的 Bot。');break;case 'save-rss':S.source.interval=qs('#rssInterval').value;S.events.unshift(`RSS 检查间隔设为 ${S.source.interval} 秒（模拟）`);toast('RSS 设置已模拟保存');render();break;case 'tg-demo-code':toast('验证码流程仅作交互演示','没有向 Telegram 发出任何请求。');break;case 'tg-demo-auth':S.tgAuthorized=true;S.events.unshift('Telegram 来源已模拟授权');toast('TG 来源已模拟授权，可自行启用来源','授权和启停是两个独立操作，正式版需验证验证码和 Session。');render();break;case 'add-rule':openRule();break;case 'add-block':{let v=qs('#newBlock')?.value.trim();if(!v){toast('请输入屏蔽词');break}if(!S.blocked.includes(v))S.blocked.push(v);toast('已模拟添加屏蔽词');render();break;}case 'save-cats':toast('版块设置已模拟保存','本原型不会持久化该选择。');break;case 'config-bot':openBot();break;case 'add-target':openTarget('bark');break;case 'add-bark':openTarget('bark');break;case 'add-ntfy':openTarget('ntfy');break;case 'save-route':S.defaultTargets=qsa('input[name=defaultTarget]:checked').map(x=>Number(x.value));toast('默认路由已模拟保存');break;case 'password-demo':toast('此为修改密码操作入口示意','正式版将要求验证原密码并安全更新会话。');break;case 'backup-demo':toast('演示：备份流程已触发','未读写数据库，没有生成真实备份文件。');break;case 'restore-demo':toast('恢复需选择并校验备份，确认停机切换','不会在网页上直接覆盖当前运行数据库。');break;case 'diagnostics-demo':toast('演示诊断：尚未连接真实后端','真实版将提供组件健康与脱敏错误信息。');break;case 'save-settings':toast('系统设置已模拟保存');break;case 'theme':S.theme=S.theme==='light'?'dark':'light';render();break;case 'export-history':toast('导出功能尚未实现','当前仅展示历史页交互模型。');break;}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-page],[data-goto],[data-action],[data-switch],[data-notify-tab],[data-filter-rule],[data-history-filter],[data-toggle-rule],[data-edit-rule],[data-delete-rule],[data-del-block],[data-test-target],[data-edit-target],[data-toggle-target],[data-del-target],[data-history-detail],[data-close-modal]');if(!el)return;if(el.dataset.page){nav(el.dataset.page);return}if(el.dataset.goto){nav(el.dataset.goto);return}if(el.dataset.action){eventAction(el.dataset.action);return}if(el.dataset.notifyTab){S.notificationsTab=el.dataset.notifyTab;render();return}if(el.dataset.filterRule){S.ruleFilter=el.dataset.filterRule;render();return}if(el.dataset.historyFilter){S.historyFilter=el.dataset.historyFilter;render();return}if(el.dataset.switch){let type=el.dataset.switch;if(type==='rss')S.source.rss=!S.source.rss;if(type==='tg'){if(!S.tgAuthorized){toast('请先在 Web 完成 Telegram 来源授权','模拟操作已阻止，避免开关显示启用但后台没有客户端。');return;}S.source.tg=!S.source.tg;}toast('开关状态已模拟更新');render();return;}if(el.dataset.toggleRule){let r=S.rules.find(x=>x.id===Number(el.dataset.toggleRule));r.enabled=!r.enabled;toast('规则状态已模拟切换');render();return}if(el.dataset.editRule){openRule(Number(el.dataset.editRule));return}if(el.dataset.deleteRule){S.rules=S.rules.filter(x=>x.id!==Number(el.dataset.deleteRule));toast('已在演示内删除规则');render();return}if(el.dataset.delBlock){S.blocked.splice(Number(el.dataset.delBlock),1);toast('已模拟移除屏蔽词');render();return}if(el.dataset.testTarget){let t=S.targets.find(x=>x.id===Number(el.dataset.testTarget));S.events.unshift(`模拟测试：${t.name}（未发送）`);toast(`已模拟测试 ${t.name}`,'未建立网络连接、没有推送任何消息。');render();return}if(el.dataset.editTarget){openTarget('bark',Number(el.dataset.editTarget));return}if(el.dataset.toggleTarget){let t=S.targets.find(x=>x.id===Number(el.dataset.toggleTarget));t.enabled=!t.enabled;toast('通知目标状态已模拟切换');render();return}if(el.dataset.delTarget){let id=Number(el.dataset.delTarget);S.targets=S.targets.filter(x=>x.id!==id);S.defaultTargets=S.defaultTargets.filter(x=>x!==id);toast('目标已从本地演示中移除');render();return}if(el.dataset.historyDetail){const fixtures=['API 已接受；无法保证设备实际收到。','网络超时；按有限重试策略处理。','规则已暂停；任务被抑制，未发送。'];toast('虚构示例任务详情',fixtures[Number(el.dataset.historyDetail)]);return}if('closeModal'in el.dataset){qs('#modalRoot').innerHTML='';return}});
qs('#themeButton').addEventListener('click',()=>eventAction('theme'));
document.addEventListener('submit',e=>{if(e.target.id!=='authForm')return;e.preventDefault();const f=new FormData(e.target),username=String(f.get('username')||'').trim(),password=String(f.get('password')||'');if(username.length<3||password.length<8){toast('使用至少三位用户名和八位虚构密码');return}if(!S.adminCreated){if(password!==String(f.get('confirmPassword')||'')){toast('两次虚构密码不一致');return}S.adminName=username;S.adminCreated=true;S.signedIn=false;toast('首次创建管理员流程模拟完成','此时进入独立登录页，没有保存密码或真实账户。');render();return}if(username!==S.adminName){toast('演示账号名称不匹配');return}S.signedIn=true;S.page='overview';render();toast('已进入 Web 管理中心（模拟）','这是离线 UI，无真实登录认证。')});
qs('#logoutButton').addEventListener('click',()=>{S.signedIn=false;render();toast('已退出本地模拟管理界面')});
qs('#resetDemo').addEventListener('click',()=>{S=initial();render();toast('演示状态已重置')});qs('#menuButton').addEventListener('click',()=>{qs('#sidebar').classList.toggle('open');qs('#backdrop').classList.toggle('visible')});qs('#backdrop').addEventListener('click',closeMobile);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){qs('#modalRoot').innerHTML='';closeMobile()}});
render();
</script>
</body>
</html>
